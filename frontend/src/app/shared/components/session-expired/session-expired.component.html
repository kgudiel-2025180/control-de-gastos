@if (visible()) {
  <div class="expired-overlay" role="alert" aria-live="assertive">
    <div class="expired-backdrop"></div>

    <div class="expired-card">
      <!-- Animated icon -->
      <div class="expired-icon">
        <div class="ring ring--outer"></div>
        <div class="ring ring--inner"></div>
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      </div>

      <h2 class="expired-title">Sesión expirada</h2>
      <p class="expired-message">
        Tu sesión ha expirado, inicia sesión de nuevo.
      </p>

      <button class="expired-btn" (click)="goToLogin()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span>Volver al login</span>
      </button>
    </div>
  </div>
}
